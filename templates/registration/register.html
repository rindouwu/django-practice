{% extends 'base.html' %}
{% block title %} Регистрация {% endblock %}

{% block content %}
<h2>Регистрация</h2>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
        <p>
            {{ field.label_tag }}
            {{ field }}
            {% if field.errors %}
                <span class="err">{{ field.errors.0 }}</span>
            {% endif %}
        </p>
    {% endfor %}
    <button type="submit">Зарегестрироваться</button>
</form>
{% endblock %}
