{% extends 'base.html' %}
{% block title %}Выполнить заявку{% endblock %}
{% block content %}
  <h2>Выполнить заявку</h2>
  <p>Заявка: <b>{{ req.title }}</b></p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% for field in form %}
      <p>
        {{ field.label_tag }}
        {{ field }}
        {% if field.errors %}
          <span class="err">
            {{ fields.errors.0 }}
          </span>
        {% endif %}
      </p>
    {% endfor %}
    <button type="submit">Завершить</button>
  </form>
{% endblock %}
