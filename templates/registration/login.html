{% extends 'base.html' %}
{% block title %} Вход {% endblock %}

{% block content %}
<h2>Вход</h2>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
        <p>
            {{ field.label_tag }}
            {{ field }}
            {% if field.errors %}
                <span class="err">{{ field.errors.0 }}</span>
            {% endif %}
        </p>
    {% endfor %}
    <button type="submit">Войти</button>
</form>
<p>Нет аккаунта? <a href="{% url 'register' %}">Зарегестрироваться</a></p>
{% endblock %}
