{% extends 'base.html' %}
{% block title %}Новая заявка{% endblock %}
{% block content %}
<h2>Новая заявка</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% for field in form %}
    <p>
        {{ field.label_tag }}<br>
        {{ field }}
        {% if field.errors %}
        <span class="err">{{ field.errors.0 }}</span>
        {% endif %}
    </p>
    {% endfor %}
    <button type="submit">Отправить</button>
</form>
{% endblock %}
