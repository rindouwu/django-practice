{% extends 'base.html' %}
{% block title %}Удаление заявки{% endblock %}
{% block content %}
<h2>Удалить заявку?</h2>
<p>«{{ req.title }}» — {{ req.category.name }}</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'profile' %}" class="btn btn-light">Отмена</a>
</form>
{% endblock %}
